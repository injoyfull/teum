<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-label="틈">
  <!-- 틈 로고 — 꽉 찬 덩어리에 새겨진 얇은 틈.
       "빈틈없이 사는 것이 미덕인 세상에서, 우리는 틈을 편듭니다."
       틈이 귀한 것은 드물기 때문이므로, 틈은 획보다 훨씬 가늘게 유지한다. -->
  <rect width="540" height="300" fill="#1A1817"/>
  <g fill="#F5F1EA">
    <rect x="268" y="58"  width="8"   height="102"/>
    <rect x="268" y="152" width="272" height="8"/>
    <rect x="264" y="225" width="276" height="8"/>
  </g>
</svg>
